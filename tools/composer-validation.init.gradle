// Hosted-only validation: bound the aggregate JVM budget and load the real
// matching rich-editor Rust runtime, not the Android ELF or a mocked connection.
allprojects {
    tasks.withType(Test).configureEach {
        maxParallelForks = 1
        // Home mixes plain Molecule tests and native-graphics Robolectric classes.
        // Isolate classloader/dispatcher state; do not drop any suite or capture.
        if (project.path == ':features:home:impl') forkEvery = 1
        testLogging { events 'started', 'failed', 'skipped' }
        // Home captures all 32 large-font/theme states in one native Compose test.
        // Preserve its upstream 2g budget; forcing 1g exhausts Robolectric ShadowTrace.
        maxHeapSize = project.path == ':features:home:impl' ? '2g' : '1g'
        jvmArgs '-XX:ActiveProcessorCount=2', '-XX:+ExitOnOutOfMemoryError'
        def nativeDir = new File(System.getenv('RUNNER_TEMP'), 'rich-editor/target/debug').absolutePath
        systemProperty 'jna.boot.library.path', nativeDir
        systemProperty 'jna.library.path', nativeDir
        systemProperty 'java.library.path', nativeDir
    }
}
